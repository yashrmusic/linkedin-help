version: '3.8'

services:
  app:
    build: .
    container_name: linkedin_bot
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    # Cloudflared for secure public access (optional)
    # command: sh -c "uvicorn app:app --host 0.0.0.0 --port 8001 & cloudflared tunnel run"
